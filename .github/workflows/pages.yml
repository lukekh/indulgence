# Builds the viewer and publishes it to GitHub Pages on every push to main.
#
# The gate's address comes from the repository variable GATE_URL
# (`gh variable set GATE_URL --body https://<gate>`). The site is served from
# /<repository name>/, so the build is given that as its base path.
name: Publish the viewer

on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # each file's last commit date, for the step before upload
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the gate address is set
        env:
          GATE_URL: ${{ vars.GATE_URL }}
        run: test -n "$GATE_URL" || { echo "Set the repository variable GATE_URL"; exit 1; }
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build -- --base="/${{ github.event.repository.name }}/"
        working-directory: web
        env:
          VITE_GATE_URL: ${{ vars.GATE_URL }}
      # Pages makes each file's ETag from its size and modified time. A fresh build dates every
      # file to the build, so each deploy would make returning visitors download every chant
      # again. So date each file copied from web/public by the last commit that changed it, and
      # each content-hashed file in assets/ by the last commit to the web. Whatever else there
      # is (index.html) keeps the build's date, so it is always fetched afresh.
      - name: Date the files by their commits, so browsers keep their copies across deploys
        working-directory: web/dist
        run: |
          web_ts=$(git log -1 --format=%ct -- ../../web ../../shared)
          find . -type f | while IFS= read -r f; do
            p=${f#./}
            if [ -f "../public/$p" ]; then ts=$(git log -1 --format=%ct -- "../public/$p")
            elif [[ $p == assets/* ]]; then ts=$web_ts
            else continue
            fi
            if [ -n "$ts" ]; then touch -d "@$ts" "$f"; fi
          done
          ls -l --time-style=+%F audio
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
