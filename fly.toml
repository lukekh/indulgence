# The gate on Fly.io: one small machine that stays up. See docs/deploying.md.
#
# Exactly one machine: live sessions and pacing timers are in its memory, so it must not be
# stopped when idle or scaled out. Deploy with `fly deploy --ha=false`.
#
# Secrets are not here. Set GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, EDGE_HMAC_KEY and
# GATE_SIGNING_KEY with `fly secrets set`.

app = "indulgence-gate"
primary_region = "iad"

[build]
  dockerfile = "gate/Dockerfile"

[env]
  # Must equal the module's INDULGENCE_ISSUER exactly, with no trailing slash.
  GATE_PUBLIC_URL = "https://indulgence-gate.fly.dev"
  SITE_URL = "https://lukekh.github.io/indulgence"
  SPACETIMEDB_URI = "wss://maincloud.spacetimedb.com"
  SPACETIMEDB_MODULE = "indulgence"
  GATE_SIGNING_KID = "gate-1"
  # Sign-in codes go to an application on the person's own computer, or to an https origin
  # listed here. Antigravity does not listen locally: it receives the code through Google's
  # relay page at this origin, so without it Antigravity cannot register to sign in.
  GATE_ALLOWED_REDIRECT_ORIGINS = "https://antigravity.google"
  PORT = "8787"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
